<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Noesis</title>
    <meta name="description" content="Scroll to explore the Noesis brochure.">
    <link rel="stylesheet" href="styles.css">

    <!-- Preload first page for instant paint (adjust if your files start at 01) -->
    <link rel="preload" as="image" href="assets/pages/page-00.png">
</head>
<body>

<!-- Loader overlay -->
<div id="loader" aria-hidden="true">
    <div class="loader-top">
        <!-- Replace with your actual logo file if you have one -->
        <div class="loader-bar"><span class="loader-bar-fill" style="width:0%"></span></div>
    </div>

    <figure class="loader-page">
        <!-- We’ll set src via JS so ZERO_BASED/WEBP settings apply -->
        <picture id="loader-picture">
            <img id="loader-img" alt="Loading brochure…" />
        </picture>
    </figure>
</div>

<!-- Main app -->
<main class="scrolly" id="app"></main>
<script src="script.js"></script>
</body>
</html>
