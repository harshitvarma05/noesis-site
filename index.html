<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">

    <!-- Preload first two pages for instant/near-instant paint -->

<!-- Loader overlay (instant hide when first 7 are ready) -->
<div id="loader" aria-hidden="true">

    </div>

            <img id="loader-img" alt="Loading brochure…">

            </li>

            <li>

                <a href="mailto:noesis.pc@gmail.com">noesis.pc@gmail.com</a>

                <a href="mailto:managernoesis@gmail.com">managernoesis@gmail.com</a>
