<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Noesis</title>
    <meta name="description" content="Scroll to explore the Noesis brochure.">
    <link rel="stylesheet" href="styles.css">

    <!-- Preload first page for instant paint (adjust name if one-based) -->
    <link rel="preload" as="image" href="assets/pages/page-00.png">
    <link rel="preload" as="image" href="assets/pages/page-01.webp">
    <link rel="preload" as="image" href="assets/pages/page-02.webp">
    <link rel="preload" as="image" href="assets/pages/page-03.webp">
</head>
<body>

<!-- Loader overlay -->
<div id="loader" aria-hidden="true">
    <div class="loader-top">
        <!-- Replace logo.svg with your own (optional). If missing, fallback text shows. -->
        <div class="loader-bar"><span class="loader-bar-fill"></span></div>
    </div>

    <figure class="loader-page">
        <img id="loader-img" alt="Loading brochure…">
    </figure>
</div>

<!-- Main content gets injected by JS -->
<main id="app"></main>
<script src="script.js"></script>
</body>
</html>
