<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Noesis</title>
    <meta name="description" content="Scroll to explore the Noesis brochure.">
    <link rel="stylesheet" href="styles.css">

    <!-- Preload first two pages for instant/near-instant paint -->
    <!-- Change to page-01.* / page-02.* if ZERO_BASED = false -->
    <link rel="preload" as="image" href="assets/pages/page-00.png">
    <link rel="preload" as="image" href="assets/pages/page-01.png">
</head>
<body>

<!-- Loader overlay (instant hide when first 7 are ready) -->
<div id="loader" aria-hidden="true">
    <div class="loader-top">
        <!-- Optional logo: place at assets/logo.svg -->
        <img class="loader-logo" src="assets/logo.svg" alt="Noesis" onerror="this.style.display='none'">
        <div class="loader-title" data-fallback>NOESIS</div>
        <div class="loader-bar"><span class="loader-bar-fill" style="width:0"></span></div>
    </div>

    <figure class="loader-page">
        <picture id="loader-picture">
            <img id="loader-img" alt="Loading brochure…">
        </picture>
    </figure>
</div>

<!-- Main app -->
<main class="scrolly" id="app"></main>
<script src="script.js"></script>
</body>
</html>
